<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sito di Prova</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-top: 50px;
        }

        /* Il contenitore universale: fa da stampo per le proporzioni */
        .box {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;       /* Centra il box nella pagina */
            position: relative;
            padding-bottom: 56.25%; /* Rapporto geometrico fisso 16:9 */
            height: 0;
            overflow: hidden;
        }

        /* L'iframe dentro il box si espande al 100% dello spazio bloccato */
        .box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <h1>VIDEO PSICHEDELICO</h1>

    <div class="box">
        <iframe src="https://www.youtube.com/embed/jfKfPfyJRdk"></iframe>
    </div>

</body>
</html>
